nelmio_api_doc:
    documentation:
        servers:
          - url: http://localhost/
            description: Local server
        info:
            title: Genealogic Tree API
            description: This is the API for the Genealogic Tree application
            version: v0.0.1
        components:
          securitySchemes:
            Bearer:
              type: http
              scheme: bearer
              bearerFormat: JWT
              description: Bearer token for authentication (private)
        security:
          - Bearer: []
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
