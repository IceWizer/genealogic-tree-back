services:
  web:
    image: httpd:2.4.71-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/web/conf/httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - php
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
  php:
    build: .
    volumes:
      - .:/var/www/html:rw
    depends_on:
      db:
        condition: service_healthy
    links:
      - "db:database"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: 1000:1000
  db:
    image: mariadb:12.3.3-noble
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD='yes'
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_USER}
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
    volumes:
      - db-volume:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql
  adminer:
    image: adminer:6.3.0
    ports:
      - 18080:8080
    depends_on:
      - db
    links:
      - "db:database"
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025

volumes:
  db-volume: {}
